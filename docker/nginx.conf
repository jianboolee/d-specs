# 容器前通常还有一层外部 nginx（见 deploy/nginx/*.conf），它到容器是 HTTP。
# 若这里直接转发 $scheme，会把上游传来的 https 覆盖成 http，导致 SITE_URL 未
# 配置时分享页生成错误的 canonical / OG 协议。优先沿用上游的 X-Forwarded-Proto。
# （map 必须在 http 上下文，配置文件被 include 进 http 块，故可写在这里）
map $http_x_forwarded_proto $dspecs_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 后端 Go 服务与 nginx 同容器，走回环地址。
    #
    # AI 对话是 SSE 流式响应，必须关闭代理缓冲：否则 nginx 会攒够一批才转发，
    # 前端就看不到逐字输出（表现为「卡住很久，然后一次性出现」）。
    location /api/ {
        proxy_pass http://127.0.0.1:8401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空 Connection，避免客户端 keep-alive 与上游连接复用冲突
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查暴露给外部（负载均衡 / 探针）
    location /health {
        proxy_pass http://127.0.0.1:8401;
        proxy_set_header Host $host;
    }

    # 分享页与 SEO 相关路径交给后端。
    #
    # /s/<id> 需要服务端渲染出 meta 与正文，不能像普通 SPA 路由那样回退到
    # 空的 index.html —— 不执行 JS 的爬虫会拿不到任何内容。
    # 用 ^~ 让前缀优先于下面的正则/SPA 回退。
    location ^~ /s/ {
        proxy_pass http://127.0.0.1:8401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # 沿用上游协议，SITE_URL 未配置时 canonical 才不会是 http
        proxy_set_header X-Forwarded-Proto $dspecs_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8401;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $dspecs_forwarded_proto;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8401;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $dspecs_forwarded_proto;
    }

    # Vite 产物文件名带内容哈希，可长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不做缓存，保证发版后能拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由统一回退到入口 HTML（分享页已在上面单独代理到后端）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
