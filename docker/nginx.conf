server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端 Go 服务与 nginx 同容器，走回环地址。
    #
    # AI 对话是 SSE 流式响应，必须关闭代理缓冲：否则 nginx 会攒够一批才转发，
    # 前端就看不到逐字输出（表现为「卡住很久，然后一次性出现」）。
    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空 Connection，避免客户端 keep-alive 与上游连接复用冲突
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查暴露给外部（负载均衡 / 探针）
    location /health {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
    }

    # Vite 产物文件名带内容哈希，可长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不做缓存，保证发版后能拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由（含 /s/:token 分享页）统一回退到入口 HTML
    location / {
        try_files $uri $uri/ /index.html;
    }
}
