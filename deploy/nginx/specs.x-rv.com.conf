# specs.x-rv.com.conf
# 参数配置表（d-specs）—— 入口机（39.107.77.69 / 172.17.255.63）外层 nginx
# 反代到业务机（47.95.176.70 / 172.17.255.64）的 d-specs 容器 nginx:80
#
# ⚠️ 域名必须落在 x-rv.com 下：d-auth 的登录态是 Domain=.x-rv.com 的共享
#    cookie，specs.x-rv.com 与 auth.x-rv.com 同属 x-rv.com 才能共享登录态。
#    （历史域名 specs.21rv.com 与 auth.x-rv.com 不同源域，收不到该 cookie。）
#
# 部署：仓库根目录 make nginx（备份 -> 上传 -> nginx -t -> reload，失败回滚）。
# 手动放：scp 到入口机 /etc/nginx/conf.d/ 后 nginx -t && systemctl reload nginx
#
# 证书：*.x-rv.com 通配符，与 d-note / d-auth 共用同一张，路径见下。

# ======================================
# HTTP：强制跳转 HTTPS
# ======================================
server {
    listen 80;
    server_name specs.x-rv.com;

    return 301 https://$host$request_uri;
}

# ======================================
# HTTPS
# ======================================
server {
    listen 443 ssl http2;
    server_name specs.x-rv.com;

    # ---------- SSL（x-rv.com 通配符证书） ----------
    ssl_certificate /home/ssl/x-rv.com/x-rv.com.pem;
    ssl_certificate_key /home/ssl/x-rv.com/x-rv.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---------- 日志 ----------
    access_log /mnt/log/nginx/specs.x-rv.com_access.log main;
    error_log /mnt/log/nginx/specs.x-rv.com_error.log;

    client_max_body_size 200m;

    # ==================================
    # AI 对话接口（SSE 流式响应）
    #
    # 必须关闭 proxy_buffering：否则 nginx 会攒够一批才转发，
    # 前端表现为「长时间无输出，然后一次性全出现」，逐字效果失效。
    # 后端已配合发送 X-Accel-Buffering: no，这里显式再关一层。
    # ==================================
    location /api/ {
        proxy_pass http://172.17.255.64:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空 Connection，避免客户端 keep-alive 与上游连接复用冲突
        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # AI 单轮最长 120s（DEEPSEEK_TIMEOUT）且可能多轮工具调用，留足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ==================================
    # 健康检查：透传到后端，返回真实依赖状态
    # ==================================
    location /health {
        proxy_pass http://172.17.255.64:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ==================================
    # 其余全部是前端静态资源与 SPA 路由
    # （含分享页 /s/<id>、/tables、/login；容器内 nginx 已做 try_files 回退）
    #
    # Cookie 跨子域：请求到本站时浏览器自动带上 auth.x-rv.com 下发的
    # dauth_access（Domain=.x-rv.com），经此透传给后端本地验签，无需额外配置。
    # ==================================
    location / {
        proxy_pass http://172.17.255.64:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}