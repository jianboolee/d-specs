# specs.example.com.conf
# 参数配置表（d-specs）—— example.com 域名
#
# 与 specs.21rv.com.conf 是同一个应用的两个域名，上游都指向宿主机 8400。
# 部署：本目录 ./upload.sh（或仓库根目录 make nginx-push），会自动
# 备份 -> 上传 -> nginx -t -> reload，失败回滚。
# 手动放：scp 到服务器 /etc/nginx/conf.d/ 后 nginx -t && systemctl reload nginx
#
# 证书与 21rv.com 的证书放在同一个目录 /mnt/ssl 下，只是文件名不同。
# 如果实际证书文件名不是 example.com.pem / example.com.key（例如通配符证书
# *.example.com.pem），只需改下面 ssl_certificate 两行即可。

# ======================================
# HTTP：强制跳转 HTTPS
# ======================================
server {
    listen 80;
    server_name specs.example.com;

    return 301 https://$host$request_uri;
}

# ======================================
# HTTPS
# ======================================
server {
    listen 443 ssl http2;
    server_name specs.example.com;

    # ---------- SSL（证书同样位于 /mnt/ssl） ----------
    ssl_certificate /home/ssl/example.com/example.com.pem;
    ssl_certificate_key /home/ssl/example.com/example.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---------- 日志 ----------
    access_log /mnt/log/nginx/specs.example.com_access.log main;
    error_log /mnt/log/nginx/specs.example.com_error.log;

    client_max_body_size 200m;

    # ==================================
    # AI 对话接口（SSE 流式响应）
    #
    # 必须关闭 proxy_buffering：否则 nginx 会攒够一批才转发，
    # 前端表现为「长时间无输出，然后一次性全出现」，逐字效果失效。
    # 后端已配合发送 X-Accel-Buffering: no，这里显式再关一层。
    # ==================================
    location /api/ {
        proxy_pass http://172.17.255.63:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空 Connection，避免客户端 keep-alive 与上游连接复用冲突
        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # AI 单轮最长 120s（DEEPSEEK_TIMEOUT）且可能多轮工具调用，留足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ==================================
    # 健康检查：透传到后端，返回真实依赖状态
    # ==================================
    location /health {
        proxy_pass http://172.17.255.63:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ==================================
    # 其余全部是前端静态资源与 SPA 路由
    # （含分享页 /s/<token>、/tables、/login；容器内 nginx 已做 try_files 回退）
    # ==================================
    location / {
        proxy_pass http://172.17.255.63:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
